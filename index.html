<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPIKE 디버거 & 조종기</title>
    <style>
        body { margin: 0; padding: 10px; background: #121212; color: #fff; font-family: monospace; }
        button { padding: 12px; margin: 4px; font-size: 14px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
        .btn-conn { background: #00e676; color: #000; }
        .btn-start { background: #29b6f6; color: #000; }
        .btn-act { background: #ffb300; color: #000; width: 65px; height: 50px; font-size: 18px; }
        #log { background: #000; color: #0f0; padding: 10px; height: 220px; overflow-y: scroll; border: 1px solid #444; font-size: 12px; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>
    <div>
        <button class="btn-conn" id="connBtn">1. 블루투스 연결</button>
        <button class="btn-start" id="startBtn">2. 허브 시동(강제실행)</button>
    </div>

    <div style="margin-top: 10px;">
        <button class="btn-act" onclick="sendKey('w')">W(전진)</button>
        <button class="btn-act" onclick="sendKey('s')">S(후진)</button>
        <button class="btn-act" onclick="sendKey('a')">A(좌)</button>
        <button class="btn-act" onclick="sendKey('d')">D(우)</button>
        <button class="btn-act" onclick="sendKey(' ')" style="background:#ff5252; color:#fff;">정지</button>
    </div>

    <div id="log">=== 디버그 로그 창 ===
여기에 모든 에러와 통신 상태가 찍힙니다.
</div>

    <script>
        const logBox = document.getElementById('log');
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logBox.innerHTML += `[${time}] ${msg}\n`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        const PB_SERVICE = 'c5f50001-8280-46da-89f4-6d8051e4aeef';
        const PB_CHAR = 'c5f50002-8280-46da-89f4-6d8051e4aeef';
        const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        let pbChar = null;
        let nusRxChar = null;
        const encoder = new TextEncoder();
        const decoder = new TextDecoder();

        document.getElementById('connBtn').addEventListener('click', async () => {
            try {
                log("블루투스 기기 검색 중...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [PB_SERVICE] }],
                    optionalServices: [NUS_SERVICE]
                });
                log(`기기 선택됨: ${device.name}`);

                const server = await device.gatt.connect();
                log("GATT 서버 연결 성공!");

                // 1. Pybricks 기본 서비스 연결 및 허브 출력 수신
                const pbService = await server.getPrimaryService(PB_SERVICE);
                pbChar = await pbService.getCharacteristic(PB_CHAR);
                await pbChar.startNotifications();
                pbChar.addEventListener('characteristicvaluechanged', (e) => {
                    const data = new Uint8Array(e.target.value.buffer);
                    if (data[0] === 0x01) { // stdout 텍스트 출력
                        log("허브 출력(PB): " + decoder.decode(data.slice(1)));
                    } else if (data[0] === 0x00) { // 상태 보고
                        log(`허브 상태코드: flag=${data[1]} (0이면 프로그램 꺼져있음!)`);
                    }
                });
                log("Pybricks 제어 채널 오픈 완료.");

                // 2. NUS (시리얼 키보드 통신) 서비스 확인
                try {
                    const nusService = await server.getPrimaryService(NUS_SERVICE);
                    nusRxChar = await nusService.getCharacteristic(NUS_RX);
                    const nusTxChar = await nusService.getCharacteristic(NUS_TX);
                    await nusTxChar.startNotifications();
                    nusTxChar.addEventListener('characteristicvaluechanged', (e) => {
                        log("허브 출력(NUS): " + decoder.decode(e.target.value));
                    });
                    log("NUS 시리얼 채널 오픈 완료!");
                } catch (nusErr) {
                    log("알림: NUS 채널 없음 -> 구형 PB 채널로
