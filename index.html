<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SPIKE RC Controller</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        #top { text-align: center; padding: 15px; }
        button { padding: 10px 18px; font-size: 16px; font-weight: bold; background: #00e676; border: none; border-radius: 8px; margin: 0 5px; }
        #controls { display: flex; flex: 1; align-items: center; justify-content: space-around; padding: 20px; }
        .slider-box { display: flex; flex-direction: column; align-items: center; }
        #throttle { -webkit-appearance: slider-vertical; width: 60px; height: 200px; }
        #steer { width: 200px; height: 60px; }
    </style>
</head>
<body>
    <div id="top">
        <button id="connectBtn">1. 블루투스 연결</button>
        <button id="startBtn" style="background:#29b6f6;">2. 차 시동 켜기</button>
        <div id="status" style="margin-top:8px; font-size:14px;">대기 중</div>
    </div>
    <div id="controls">
        <div class="slider-box">
            <p>엑셀 / 후진</p>
            <input type="range" id="throttle" min="-100" max="100" value="0">
        </div>
        <div class="slider-box">
            <p>좌 / 우 조향</p>
            <input type="range" id="steer" min="-100" max="100" value="0">
        </div>
    </div>

    <script>
        const SERVICE_UUID = 'c5f50001-8280-46da-89f4-6d8051e4aeef';
        const CHAR_UUID = 'c5f50002-8280-46da-89f4-6d8051e4aeef';
        let characteristic = null;
        let isSending = false;

        const throttle = document.getElementById('throttle');
        const steer = document.getElementById('steer');
        const statusText = document.getElementById('status');

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                characteristic = await service.getCharacteristic(CHAR_UUID);
                statusText.innerText = "연결됨! '2. 차 시동 켜기' 또는 허브 버튼을 누르세요.";
            } catch (err) {
                statusText.innerText = "연결 실패: " + err;
            }
        });

        // 폰에서 허브 프로그램 원격 실행 (0x01 커맨드)
        document.getElementById('startBtn').addEventListener('click', async () => {
            if (!characteristic) return;
            try {
                await characteristic.writeValueWithResponse(new Uint8Array([0x01]));
                statusText.innerText = "시동 명령 전송 완료!";
            } catch (e) {
                statusText.innerText = "허브 가운데 버튼을 직접 눌러주세요.";
            }
        });

        async function sendCommand() {
            if (!characteristic || isSending) return;
            isSending = true;
            try {
                // +110 오프셋으로 10 ~ 210 범위 전송 (0x03 Ctrl+C 방지)
                const p = parseInt(throttle.value) + 110;
                const s = parseInt(steer.value) + 110;
                const data = new Uint8Array([0x06, p, s]);
                await characteristic.writeValueWithResponse(data);
            } catch (e) {}
            isSending = false;
        }

        ['touchend', 'mouseup'].forEach(evt => {
            throttle.addEventListener(evt, () => { throttle.value = 0; sendCommand(); });
            steer.addEventListener(evt, () => { steer.value = 0; sendCommand(); });
        });

        setInterval(sendCommand, 80);
    </script>
</body>
</html>
