<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SPIKE RC Controller</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        #top { text-align: center; padding: 15px; background: #2a2a2a; }
        button { padding: 12px 20px; font-size: 16px; font-weight: bold; background: #00e676; border: none; border-radius: 8px; cursor: pointer; }
        #controls { display: flex; flex: 1; align-items: center; justify-content: space-around; padding: 20px; }
        .slider-box { display: flex; flex-direction: column; align-items: center; }
        #throttle { -webkit-appearance: slider-vertical; width: 60px; height: 200px; }
        #steer { width: 200px; height: 60px; }
    </style>
</head>
<body>
    <div id="top">
        <button id="connectBtn">허브 블루투스 연결</button>
        <div id="status" style="margin-top:10px; font-size:14px; color:#ffd54f;">연결 대기 중...</div>
    </div>
    <div id="controls">
        <div class="slider-box">
            <p>엑셀 / 후진</p>
            <input type="range" id="throttle" min="-100" max="100" value="0">
        </div>
        <div class="slider-box">
            <p>좌 / 우 조향</p>
            <input type="range" id="steer" min="-100" max="100" value="0">
        </div>
    </div>

    <script>
        const PYBRICKS_SERVICE = 'c5f50001-8280-46da-89f4-6d8051e4aeef';
        const PYBRICKS_CHAR = 'c5f50002-8280-46da-89f4-6d8051e4aeef';
        const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const NUS_RX_CHAR = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

        let rxChar = null;
        let useNus = false;
        let isSending = false;

        const throttle = document.getElementById('throttle');
        const steer = document.getElementById('steer');
        const statusText = document.getElementById('status');

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [PYBRICKS_SERVICE] }],
                    optionalServices: [NUS_SERVICE]
                });
                const server = await device.gatt.connect();

                // 1순위: 최신 펌웨어용 NUS 채널 탐색
                try {
                    const nusService = await server.getPrimaryService(NUS_SERVICE);
                    rxChar = await nusService.getCharacteristic(NUS_RX_CHAR);
                    useNus = true;
                } catch (e) {
                    // 2순위: 구형 펌웨어용 Pybricks 채널 폴백
                    const pbService = await server.getPrimaryService(PYBRICKS_SERVICE);
                    rxChar = await pbService.getCharacteristic(PYBRICKS_CHAR);
                    useNus = false;
                }

                statusText.innerText = "연결 성공! (모드: " + (useNus ? "NUS" : "PB") + ") - 허브에 초록불이 켜져있는지 확인하세요!";
            } catch (err) {
                statusText.innerText = "연결 실패: " + err;
            }
        });

        async function sendCommand() {
            if (!rxChar || isSending) return;
            isSending = true;
            try {
                const p = parseInt(throttle.value) + 110;
                const s = parseInt(steer.value) + 110;
                // 255는 패킷 시작 알림 바이트
                const payload = useNus ? new Uint8Array([255, p, s]) : new Uint8Array([0x06, 255, p, s]);

                if (rxChar.properties.writeWithoutResponse) {
                    await rxChar.writeValueWithoutResponse(payload);
                } else {
                    await rxChar.writeValueWithResponse(payload);
                }
                statusText.innerText = `전송중 -> 속도: ${throttle.value} / 조향: ${steer.value}`;
            } catch (e) {
                statusText.innerText = "전송 에러: " + e.message;
            }
            isSending = false;
        }

        ['input', 'change'].forEach(evt => {
            throttle.addEventListener(evt, sendCommand);
            steer.addEventListener(evt, sendCommand);
        });

        ['touchend', 'mouseup'].forEach(evt => {
            throttle.addEventListener(evt, () => { throttle.value = 0; sendCommand(); });
            steer.addEventListener(evt, () => { steer.value = 0; sendCommand(); });
        });

        setInterval(sendCommand, 100);
    </script>
</body>
</html>
