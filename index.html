<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SPIKE RC Controller</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; user-select: none; }
        #top { text-align: center; padding: 15px; background: #2a2a2a; display: flex; justify-content: center; align-items: center; gap: 15px; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #00e676; color: #000; border: none; border-radius: 8px; cursor: pointer; }
        #status { font-size: 15px; color: #ffd54f; font-weight: bold; }
        #controls { display: flex; flex: 1; align-items: center; justify-content: space-around; padding: 20px; }
        .slider-box { display: flex; flex-direction: column; align-items: center; }
        .slider-box p { margin-bottom: 20px; font-size: 18px; font-weight: bold; color: #ccc; }
        /* 엑셀: 세로 슬라이더 */
        #throttle { -webkit-appearance: slider-vertical; width: 70px; height: 220px; }
        /* 조향: 가로 슬라이더 */
        #steer { width: 220px; height: 70px; }
    </style>
</head>
<body>
    <div id="top">
        <button id="connectBtn">허브 블루투스 연결</button>
        <span id="status">연결 대기 중</span>
    </div>
    <div id="controls">
        <div class="slider-box">
            <p>엑셀 / 후진</p>
            <input type="range" id="throttle" min="-100" max="100" value="0">
        </div>
        <div class="slider-box">
            <p>좌 / 우 조향</p>
            <input type="range" id="steer" min="-100" max="100" value="0">
        </div>
    </div>

    <script>
        const PB_SERVICE = 'c5f50001-8280-46da-89f4-6d8051e4aeef';
        const PB_CHAR = 'c5f50002-8280-46da-89f4-6d8051e4aeef';
        const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        let rxChar = null;
        let useNus = false;
        let isSending = false;
        const encoder = new TextEncoder();

        const throttle = document.getElementById('throttle');
        const steer = document.getElementById('steer');
        const statusText = document.getElementById('status');

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                statusText.innerText = "검색 중...";
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [PB_SERVICE] }],
                    optionalServices: [NUS_SERVICE]
                });
                const server = await device.gatt.connect();

                const pbService = await server.getPrimaryService(PB_SERVICE);
                const pbChar = await pbService.getCharacteristic(PB_CHAR);
                await pbChar.startNotifications();

                try {
                    const nusService = await server.getPrimaryService(NUS_SERVICE);
                    const txChar = await nusService.getCharacteristic(NUS_TX);
                    await txChar.startNotifications();
                    rxChar = await nusService.getCharacteristic(NUS_RX);
                    useNus = true;
                } catch (e) {
                    rxChar = pbChar;
                    useNus = false;
                }

                statusText.style.color = "#00e676";
                statusText.innerText = "연결 완료! 운전 가능";
            } catch (err) {
                statusText.style.color = "#ff5252";
                statusText.innerText = "연결 실패";
            }
        });

        async function sendCommand() {
            if (!rxChar || isSending) return;
            isSending = true;
            try {
                const bytes = encoder.encode(`${throttle.value},${steer.value}\n`);
                let payload = bytes;

                if (!useNus) {
                    payload = new Uint8Array(bytes.length + 1);
                    payload[0] = 0x06;
                    payload.set(bytes, 1);
                }

                if (rxChar.properties.writeWithoutResponse) {
                    await rxChar.writeValueWithoutResponse(payload);
                } else {
                    await rxChar.writeValueWithResponse(payload);
                }
            } catch (e) {}
            isSending = false;
        }

        // 슬라이더 조작 시 즉시 전송
        ['input', 'change'].forEach(evt => {
            throttle.addEventListener(evt, sendCommand);
            steer.addEventListener(evt, sendCommand);
        });

        // 손 떼면 자동으로 중립(0) 복귀
        ['touchend', 'mouseup'].forEach(evt => {
            throttle.addEventListener(evt, () => { throttle.value = 0; sendCommand(); });
            steer.addEventListener(evt, () => { steer.value = 0; sendCommand(); });
        });

        // 신호 유지용 주기적 전송
        setInterval(sendCommand, 80);
    </script>
</body>
</html>
